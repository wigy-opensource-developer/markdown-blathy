[package]
name = "tauri-md-editor"
version = "0.1.0"
description = "Markdown editor with Typst-powered live preview and PDF export"
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "tauri_md_editor_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Cross-platform "open in system viewer" for exported PDFs (M4). Rust-side
# only — no webview capability is exposed (keeps the least-privilege posture
# of §7.3). MIT OR Apache-2.0.
open = "5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# URL scheme validation for the external-link policy (§7.4) — already in the
# tree via tauri, declared directly because links.rs uses it.
url = "2"

# default-features = false: comrak's defaults pull the CLI and the
# syntect/onig syntax-highlighting stack, which this project does not use
# (Typst highlights code itself). Keep only the parser.
comrak = { version = "0.54", default-features = false }

# Typst 0.15 engine line — these four crates are released in lockstep and
# must share the same minor version. typst-as-lib 0.16 is the first line
# compatible with Typst 0.15 (0.15.x pins Typst 0.14).
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
typst-svg = "0.15"
# typst-kit-fonts: system-font discovery via typst-kit. Used by the M6 engine
# cache — fonts are scanned once per engine (re)build, not per render. typst-kit
# is also used directly to subset the font book to the families a custom
# template actually references (small book = fast compiles, §6.3).
typst-as-lib = { version = "0.16", features = ["typst-kit-fonts"] }
typst-kit = { version = "0.15", features = ["scan-fonts"] }

# M7: structured diagnostic logging — replaces eprintln! with leveled
# tracing output controlled by RUST_LOG (default: warn).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
