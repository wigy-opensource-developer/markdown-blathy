[package]
name = "markdown-blathy-tauri"
description = "Markdown, transformed — Markdown editor with Typst-powered live preview and PDF export"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "markdown_blathy_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
markdown-blathy-core = { path = "../crates/markdown-blathy-core" }

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Cross-platform "open in system viewer" for exported PDFs (M4). Rust-side
# only — no webview capability is exposed (keeps the least-privilege posture
# of §7.3). MIT OR Apache-2.0.
open = "5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# M7: structured diagnostic logging — the app initializes the subscriber;
# the core modules only emit `tracing` events.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
