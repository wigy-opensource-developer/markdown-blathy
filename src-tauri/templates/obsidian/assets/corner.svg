<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 240 180">
  <defs>
    <!-- Fade: fully transparent at the bottom-right corner, opaque (matching
         the page fill) farther away, so the graph dissolves with distance. -->
    <radialGradient id="fade" cx="1" cy="1" r="1.25" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#191724" stop-opacity="0" />
      <stop offset="0.45" stop-color="#191724" stop-opacity="0.12" />
      <stop offset="1" stop-color="#191724" stop-opacity="1" />
    </radialGradient>
  </defs>

  <!-- Edges: a little linked-note graph, densest near the corner. -->
  <g stroke="#7c3aed" stroke-width="2" stroke-linecap="round">
    <line x1="222" y1="162" x2="196" y2="146" />
    <line x1="222" y1="162" x2="168" y2="174" />
    <line x1="196" y1="146" x2="150" y2="114" />
    <line x1="196" y1="146" x2="208" y2="82" />
    <line x1="168" y1="174" x2="118" y2="160" />
    <line x1="150" y1="114" x2="208" y2="82" />
    <line x1="150" y1="114" x2="108" y2="58" />
    <line x1="150" y1="114" x2="118" y2="160" />
    <line x1="208" y1="82" x2="108" y2="58" />
    <line x1="108" y1="58" x2="64" y2="116" />
    <line x1="108" y1="58" x2="40" y2="38" />
    <line x1="64" y1="116" x2="58" y2="82" />
    <line x1="40" y1="38" x2="58" y2="82" />
  </g>

  <!-- Nodes, colored with the theme's accent palette. -->
  <circle cx="222" cy="162" r="12.5" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.7" />
  <circle cx="222" cy="162" r="8" fill="#eb6f92" />
  <circle cx="196" cy="146" r="5" fill="#9ccfd8" />
  <circle cx="168" cy="174" r="5" fill="#c4a7e7" />
  <circle cx="150" cy="114" r="5" fill="#f6c177" />
  <circle cx="208" cy="82" r="5" fill="#9ccfd8" />
  <circle cx="108" cy="58" r="5" fill="#c4a7e7" />
  <circle cx="64" cy="116" r="5" fill="#eb6f92" />
  <circle cx="40" cy="38" r="5" fill="#f6c177" />
  <circle cx="118" cy="160" r="4" fill="#9ccfd8" />
  <circle cx="58" cy="82" r="4" fill="#c4a7e7" />

  <!-- Fade everything far from the corner into the page background. -->
  <rect width="240" height="180" fill="url(#fade)" />
</svg>
