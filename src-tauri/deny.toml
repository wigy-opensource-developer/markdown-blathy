# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with: cargo deny check   (from src-tauri/, where the crate lives)

[advisories]
version = 2
ignore = [
  # Status-only "unmaintained" advisories (no vulnerability, no patched
  # version available) for crates that are transitive dependencies of the
  # Tauri 2 framework itself:
  #
  # rust-unic family — via `urlpattern` -> `tauri-utils`:
  "RUSTSEC-2025-0098",  # unic-ucd-version
  "RUSTSEC-2025-0100",  # unic-ucd-ident
  "RUSTSEC-2025-0081",  # unic-char-property
  "RUSTSEC-2025-0080",  # unic-common
  "RUSTSEC-2025-0075",  # unic-char-range
  #
  # gtk-rs GTK3 bindings — Tauri 2 on Linux builds on GTK3/webkit2gtk:
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  #
  # proc-macro-error — build-time macro helper of the gtk-rs stack:
  "RUSTSEC-2024-0370",
  #
  # Typst 0.15 dependency tree (introduced with M2). These are transitive
  # dependencies of the typst crates themselves; no newer non-breaking
  # version satisfies the typst 0.15 constraints (checked Aug 2026):
  #
  # Status-only "unmaintained" advisories (no vulnerability, no patched
  # version available):
  "RUSTSEC-2025-0141",  # bincode 1.x — via typst-library
  "RUSTSEC-2024-0436",  # paste — via hayagriva (typst-library, bibliography)
  "RUSTSEC-2026-0206",  # rustybuzz — font shaping, via typst-library
  "RUSTSEC-2026-0192",  # ttf-parser — font parsing, via usvg
  "RUSTSEC-2024-0320",  # yaml-rust — via hayagriva (typst-library)
  #
  # quick-xml 0.38.x vulnerabilities (RUSTSEC-2026-0194/0195). The patched
  # line is >=0.41, but citationberg 0.7.0 (a typst-library dependency) pins
  # `quick-xml ^0.38`, so the fix is unavailable without forking typst. The
  # vulnerable code path is citation/CSL XML parsing, reachable only through
  # Typst's `bibliography()`; the v1 world (§12) resolves *only* the main
  # source file — no file-system, package, or network resolver — so no
  # untrusted XML can reach quick-xml in this app.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  #
  # LaTeX math translator (tylax -> mitex). `fxhash` is unmaintained but has
  # no vulnerability. `rkyv` 0.7.46 is used by mitex-spec only to read its
  # *static, build-time-generated* command-spec archive; this app never
  # deserializes untrusted rkyv archives (the only render input is Markdown
  # text). The patched rkyv 0.8 line is not compatible with mitex 0.2.
  "RUSTSEC-2025-0057",  # fxhash — unmaintained
  "RUSTSEC-2026-0235",  # rkyv 0.7 — static spec archive only
  #
  # unsafe-libyaml is unmaintained and reached through serde_yaml ->
  # hayagriva -> typst-library. Typst's parser is the only consumer; the app
  # never reads user-provided YAML through this path (front matter uses the
  # small `key: value` scanner in markdown/frontmatter.rs).
  "RUSTSEC-2024-0449",  # unsafe-libyaml — unmaintained
]

[licenses]
version = 2
# This project is GPL-3.0-or-later, so only licenses compatible with GPLv3
# may be linked in. The list is deliberately strict: it contains exactly the
# licenses currently present in the dependency tree (Cargo.lock). If a new
# dependency introduces another license, cargo-deny fails and it must be
# reviewed before being added here. Permissive and GPLv3-compatible copyleft
# licenses are acceptable; AGPL, GPL-2.0-only, and proprietary licenses are
# not compatible and must not be added.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
  "GPL-3.0-or-later",
  "LGPL-2.1-or-later",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Duplicate versions of these crates are intentional and harmless. Each
# version is pinned by a different (often platform- or tooling-specific)
# dependency edge of the Tauri 2 toolchain; they cannot be unified. Skipping
# them silences the duplicate-version warnings. Note that skipping here only
# affects the bans check — every version is still covered by the [licenses]
# check above.
#
# Windows-only crates (never compiled in this Linux/macOS desktop build):
skip = [
  { name = "windows-link" },
  { name = "windows-sys" },
  { name = "windows-targets" },
  { name = "windows_aarch64_gnullvm" },
  { name = "windows_aarch64_msvc" },
  { name = "windows_i686_gnu" },
  { name = "windows_i686_gnullvm" },
  { name = "windows_i686_msvc" },
  { name = "windows_x86_64_gnu" },
  { name = "windows_x86_64_gnullvm" },
  { name = "windows_x86_64_msvc" },
  # Shared build-time and macro crates whose versions are pinned independently
  # by unrelated toolchain dependencies (e.g. tauri-build, gtk-rs macros):
  { name = "base64" },
  { name = "bitflags" },
  { name = "getrandom" },
  { name = "hashbrown" },
  { name = "heck" },
  { name = "indexmap" },
  { name = "png" },
  { name = "proc-macro-crate" },
  { name = "r-efi" },
  { name = "serde_spanned" },
  { name = "syn" },
  { name = "thiserror" },
  { name = "thiserror-impl" },
  { name = "toml" },
  { name = "toml_datetime" },
  { name = "toml_edit" },
  { name = "winnow" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
