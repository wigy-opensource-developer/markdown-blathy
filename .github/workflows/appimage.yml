name: Build AppImage

# Manual dispatch — only on the master branch.
# The AppImage artifact is available for download from the Actions tab.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    # Guard: only the default branch (master) is allowed — prevents an
    # attacker opening a PR that adds an appimage.yml on a different branch
    # and dispatching it with workflow_dispatch.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- system dependencies (Tauri + appimagetool runtime) ----------------
      - name: install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # ---- Rust toolchain ----------------------------------------------------
      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ---- appimagetool runtime dependency (no FUSE needed) ------------------
      # appimagetool's --appimage-extract-and-run extracts the AppImage to a
      # temp dir, but the extracted binary still needs libfuse at runtime.
      # Install it so mksquashfs (bundled inside appimagetool) works.
      - name: install libfuse2
        run: sudo apt-get install -y -qq libfuse2t64 || sudo apt-get install -y -qq libfuse2

      # ---- Node.js -----------------------------------------------------------
      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install npm dependencies
        run: npm ci

      # ---- build AppImage ----------------------------------------------------
      - name: build AppImage
        run: python3 scripts/build-appimage.py

      # ---- upload artifact ---------------------------------------------------
      - name: upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-md-editor-x86_64.AppImage
          path: target/appimage/tauri-md-editor-*.AppImage
          if-no-files-found: error
