name: macOS

# Builds a universal (Apple Silicon + Intel) .dmg, either from the Actions tab
# (`workflow_dispatch`) or as a job of the tag-triggered Release workflow
# (`workflow_call`).
#
# NOTE: signing is OPTIONAL. With no Apple secrets the bundle is unsigned
# (Gatekeeper warns on first launch; right-click → Open, or
# `xattr -dr com.apple.quarantine`), which is enough for testing. Setting
# `APPLE_CERTIFICATE` (+ password) or `APPLE_SIGNING_IDENTITY` switches signing
# on; adding `APPLE_ID`, `APPLE_PASSWORD` and `APPLE_TEAM_ID` also notarizes.
#
# The variables must be *absent*, not empty, when unsigned: Tauri checks
# whether they are present and would otherwise try to import an empty
# certificate ("SecKeychainItemImport: One or more parameters … not valid").

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: macos-14
    env:
      # `if:` cannot read secrets directly, so reduce "is signing configured?"
      # to a plain boolean here.
      SIGNING_CONFIGURED: >-
        ${{ secrets.APPLE_CERTIFICATE != '' || secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: install Rust toolchain
        # Keep in sync with rust-toolchain.toml (single source for local + CI).
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          # A universal binary needs both slices.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: install npm dependencies
        run: npm ci

      # Export only the signing variables that actually have a value. Tauri
      # tests for presence, so an empty APPLE_CERTIFICATE would make it try to
      # import an empty certificate instead of skipping signing.
      - name: configure code signing (optional)
        if: env.SIGNING_CONFIGURED == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_VALUE: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          export_value() {
            if [ -n "$2" ]; then
              {
                echo "$1<<__SIGNING_EOF__"
                printf '%s\n' "$2"
                echo "__SIGNING_EOF__"
              } >> "$GITHUB_ENV"
            fi
          }
          export_value APPLE_CERTIFICATE "$CERT"
          export_value APPLE_CERTIFICATE_PASSWORD "$CERT_PASSWORD"
          export_value APPLE_SIGNING_IDENTITY "$IDENTITY"
          export_value APPLE_ID "$APPLE_ID_VALUE"
          export_value APPLE_PASSWORD "$APPLE_PASSWORD_VALUE"
          export_value APPLE_TEAM_ID "$TEAM_ID"

      # Tauri's beforeBuildCommand (npm run build) covers the frontend.
      - name: build universal .dmg
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg

      - name: upload .dmg
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
