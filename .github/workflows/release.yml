name: Release

# Tag-triggered release: on `v*` tags, build every platform artifact in its own
# reusable workflow (the same files are dispatchable by hand from the Actions
# tab), then open an *unpublished* draft GitHub release with all the artifacts
# and git-cliff release notes. Publishing is always a manual step — nothing is
# public until a human publishes the draft.
#
# Adding a platform = adding a job here that calls its workflow; the artifact
# upload inside that workflow is picked up by the merge step below.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deb:
    # Pin the runner image inside each workflow: ubuntu-latest is migrating to
    # Ubuntu 26.04, so the Linux builds stay on a verified LTS.
    uses: ./.github/workflows/linux-deb.yml

  rpm:
    uses: ./.github/workflows/linux-rpm.yml

  appimage:
    uses: ./.github/workflows/linux-appimage.yml

  macos:
    uses: ./.github/workflows/macos.yml

  windows:
    uses: ./.github/workflows/windows.yml

  release:
    needs: [deb, rpm, appimage, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      # Required to create the draft release and attach assets.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so git-cliff can see every commit since the last tag.
          fetch-depth: 0

      - name: install git-cliff
        run: cargo install git-cliff --locked --version 2.14.2

      # Every called workflow uploaded its artifact into this same run; merge
      # them into one flat directory for the release assets.
      - name: collect artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist
          merge-multiple: true

      - name: list artifacts
        run: ls -lh dist

      - name: generate release notes
        run: git-cliff --latest --output RELEASE_NOTES.md

      - name: create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: RELEASE_NOTES.md
          files: dist/*
