name: Release

# Tag-triggered release: on `v*` tags, build the production binary, package
# `.deb`, `.rpm` and the AppImage, and open an *unpublished* draft GitHub
# release with the artifacts and git-cliff release notes. Publishing is always
# a manual step — nothing is public until a human publishes the draft.
#
# The existing `appimage.yml` remains the manual-dispatch fallback.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Pin the image: ubuntu-latest is migrating to Ubuntu 26.04. Stay on a
    # known-good LTS until the Tauri dependencies are verified on 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so git-cliff can see every commit since the last tag.
          fetch-depth: 0

      # ---- system dependencies (Tauri + appimagetool runtime) ----------------
      - name: install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            imagemagick \
            file

      # ---- Rust toolchain ----------------------------------------------------
      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ---- git-cliff (pinned) ------------------------------------------------
      - name: install git-cliff
        run: cargo install git-cliff --locked --version 2.14.2

      # ---- appimagetool runtime dependency (no FUSE needed) ------------------
      - name: install libfuse2
        run: sudo apt-get install -y -qq libfuse2t64 || sudo apt-get install -y -qq libfuse2

      # ---- Node.js -----------------------------------------------------------
      - name: setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: install npm dependencies
        run: npm ci

      # ---- build .deb and .rpm ----------------------------------------------
      # Tauri's beforeBuildCommand (npm run build) covers the frontend.
      - name: build deb and rpm
        run: npm run tauri -- build --bundles deb,rpm

      # ---- build AppImage ----------------------------------------------------
      # Reuses the binary built above (build-appimage.py skips the rebuild when
      # the binary is current) and assembles the AppDir + AppImage.
      - name: build AppImage
        run: python3 scripts/build-appimage.py

      # ---- release notes -----------------------------------------------------
      - name: generate release notes
        run: git-cliff --latest --output RELEASE_NOTES.md

      # ---- draft release -----------------------------------------------------
      - name: create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: RELEASE_NOTES.md
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            target/appimage/*.AppImage
