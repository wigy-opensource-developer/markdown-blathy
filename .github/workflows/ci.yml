name: CI

# Runs on every push to a branch and on every pull request.
# Uses ``pull_request`` (not ``pull_request_target``) so fork PRs
# have zero access to repository secrets (§7.3).
#
# Tag pushes are excluded on purpose: a release tag points at a commit that
# CI has already checked, and the tag-triggered release.yml builds the
# artifacts, so running the gate again on the tag buys nothing. Listing
# ``branches`` is what excludes tags — an unfiltered ``push:`` runs on both.

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pin the image: ubuntu-latest is migrating to Ubuntu 26.04. Stay on a
    # known-good LTS until the Tauri dependencies are verified on 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # ---- system dependencies (Tauri + cargo-deny) ---------------------------
      - uses: ./.github/actions/linux-deps

      # ---- Rust toolchain ----------------------------------------------------
      - name: install Rust toolchain
        # Keep in sync with rust-toolchain.toml (single source for local + CI).
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # ---- cargo-deny (license/security audit) --------------------------------
      - name: install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      # ---- Node.js -----------------------------------------------------------
      - name: setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: install npm dependencies
        run: npm ci

      # ---- quality gate ------------------------------------------------------
      - name: run check.sh
        run: ./check.sh
