name: CI

# Runs on every push and pull request.
# Uses ``pull_request`` (not ``pull_request_target``) so fork PRs
# have zero access to repository secrets (§7.3).

on:
  push:
  pull_request:

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- system dependencies (Tauri + cargo-deny) ---------------------------
      - name: install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # ---- Rust toolchain ----------------------------------------------------
      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ---- cargo-deny (license/security audit) --------------------------------
      - name: install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      # ---- Node.js -----------------------------------------------------------
      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install npm dependencies
        run: npm ci

      # ---- quality gate ------------------------------------------------------
      - name: run check.sh
        run: ./check.sh
