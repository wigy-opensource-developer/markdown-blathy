name: CI

# Runs on every push to a branch and on every pull request.
# Uses ``pull_request`` (not ``pull_request_target``) so fork PRs
# have zero access to repository secrets (§7.3).
#
# Tag pushes are excluded on purpose: a release tag points at a commit that
# CI has already checked, and the tag-triggered release.yml builds the
# artifacts, so running the gate again on the tag buys nothing. Listing
# ``branches`` is what excludes tags — an unfiltered ``push:`` runs on both.

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pin the image: ubuntu-latest is migrating to Ubuntu 26.04. Stay on a
    # known-good LTS until the Tauri dependencies are verified on 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # ---- system dependencies (Tauri + cargo-deny) ---------------------------
      - uses: ./.github/actions/linux-deps

      # ---- Rust toolchain ----------------------------------------------------
      - name: install Rust toolchain
        # Keep in sync with rust-toolchain.toml (single source for local + CI).
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # ---- cargo-deny (license/security audit) --------------------------------
      - name: install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      # ---- Node.js -----------------------------------------------------------
      - name: setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: install npm dependencies
        run: npm ci

      # ---- quality gate ------------------------------------------------------
      - name: run check.sh
        run: ./check.sh

  headless-smoke:
    # The GUI must initialize a real WebKitGTK webview without a display.
    # This is the environment gate the WebDriver E2E layer builds on
    # (TESTING.md); a window that crashes on startup fails here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Same build stack as the check job, plus the headless extras.
      - uses: ./.github/actions/linux-deps
        with:
          headless: "true"

      - name: install Rust toolchain
        # Keep in sync with rust-toolchain.toml (single source for local + CI).
        uses: dtolnay/rust-toolchain@1.99.1

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: install npm dependencies
        run: npm ci

      # A debug build is enough for the smoke test and far faster than a
      # release bundle; the frontend dist must exist because tauri-build
      # embeds it at compile time.
      - name: build frontend
        run: npm run build

      # A plain `cargo build` links the dev server URL; the `custom-protocol`
      # feature embeds `dist/` so the binary is self-contained like
      # `tauri build` (without it the smoke test would see a blank window).
      - name: build GUI (debug, embedded frontend)
        run: cargo build -p markdown-blathy-tauri --features tauri/custom-protocol

      - name: smoke test (renders a preview under Xvfb)
        run: ./scripts/smoke-headless.sh target/debug/markdown-blathy-tauri
