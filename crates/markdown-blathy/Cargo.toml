[package]
name = "markdown-blathy"
description = "Command-line interface for MarkdownBláthy"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "markdown-blathy"
path = "src/main.rs"

[dependencies]
markdown-blathy-core = { path = "../markdown-blathy-core" }

clap = { version = "4", features = ["derive"] }
serde_json = "1"

# Explicit `--open` support for exported PDFs; the core never launches a
# viewer and the GUI keeps its own adapter.
open = "5"
