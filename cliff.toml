# git-cliff configuration for MarkdownBláthy.
# See https://git-cliff.org/docs/configuration

[changelog]
# Static header. When prepending with `--prepend`, git-cliff matches this
# text to replace the previous header; past release sections are never
# touched (see CONTRIBUTING.md, "How to release a new version").
header = "Changelog"
# A stable marker written after a header that uses template variables. With a
# static header (above) the marker is not emitted; set it here so that if the
# header ever becomes a template, `--prepend` still replaces it correctly.
header_marker = "<!-- git-cliff: end of header -->"
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## [unreleased]
{% endif %}{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | striptags | trim | upper_first }}
{% for commit in entry.commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}{% endfor %}
{% endfor %}
"""
trim = true
footer = "<!-- generated by git-cliff -->"

[git]
# Tags are v-prefixed (e.g. v0.1.0).
tag_pattern = "v[0-9].*"
